[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedme"
version = "0.1.0"
description = "Low-friction food ordering dev CLI for Swiggy MCP servers (zero-phone by default, QR is an opt-in exception)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-qrcode>=7.4",
]

[project.scripts]
feedme = "feedme.cli:app"

# src/models.py is a sibling of src/feedme/, not inside the package (per
# CLAUDE.md's repo layout). `sources = ["src"]` strips the "src/" prefix on
# build, so both src/feedme/ -> feedme/ and src/models.py -> models.py land
# at the wheel root as independently importable top-level modules.
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/feedme", "src/models.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
